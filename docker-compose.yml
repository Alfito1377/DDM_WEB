services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ddm-web-app
        restart: unless-stopped
        volumes:
            - app-storage:/var/www/html/storage/app
            - app-logs:/var/www/html/storage/logs
        env_file:
            - .env
        networks:
            - ddm
        depends_on:
            - migrate

    web:
        image: nginx:alpine
        container_name: ddm-web-nginx
        restart: unless-stopped
        ports:
            - "8090:80"
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
        networks:
            - ddm
        depends_on:
            - app

    migrate:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ddm-web-migrate
        env_file:
            - .env
        user: root
        command: >
            sh -c "
              php artisan migrate --force &&
              php artisan optimize &&
              php artisan storage:link
            "
        networks:
            - ddm

    queue:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ddm-web-queue
        restart: unless-stopped
        env_file:
            - .env
        user: www-data
        command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
        networks:
            - ddm
        depends_on:
            - migrate

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ddm-web-scheduler
        restart: unless-stopped
        env_file:
            - .env
        user: www-data
        command: php artisan schedule:work
        networks:
            - ddm
        depends_on:
            - migrate

volumes:
    app-storage:
    app-logs:

networks:
    ddm:
        external: true
